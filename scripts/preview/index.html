<!doctype html>
<meta charset="utf-8">
<title>arpentry world preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 10px; padding: 8px 10px; border-radius: 6px;
         background: rgba(20,20,22,.82); color: #e8e6e1; max-width: 250px;
         backdrop-filter: blur(6px); }
  #status { white-space: pre-wrap; }
  #status.err { color: #ff8a7a; }
  #layers { margin-top: 8px; max-height: 60vh; overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,.14); padding-top: 6px; }
  #layers label { display: block; cursor: pointer; opacity: .85; }
  #layers label:hover { opacity: 1; }
  #layers input { vertical-align: -1px; margin-right: 5px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 3px 6px;
           background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
           border-radius: 4px; }
  button:hover { background: rgba(255,255,255,.16); }
  .dim { opacity: .55; }
  #census { position: fixed; top: 10px; right: 10px; width: 340px; padding: 8px 10px;
            border-radius: 6px; background: rgba(20,20,22,.82); color: #e8e6e1;
            backdrop-filter: blur(6px); display: none; }
  #species label { display: inline-block; margin-right: 8px; cursor: pointer; }
  #species i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; }
  #defects { margin-top: 6px; max-height: 45vh; overflow-y: auto;
             border-top: 1px solid rgba(255,255,255,.14); padding-top: 4px; }
  #defects div { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  #defects div:hover { opacity: 1; background: rgba(255,255,255,.06); }
  #defects div.on { background: rgba(255,255,255,.14); opacity: 1; }
  #defects .real { color: #ff9d8a; } #defects .fine { color: #8fd694; }
  #detail { margin-top: 6px; white-space: pre-wrap; border-top: 1px solid rgba(255,255,255,.14); padding-top: 4px; user-select: text; }
</style>

<div id="hud">
  <div id="status">starting…</div>
  <div id="cam" class="dim"></div>
  <div class="row">
    <button id="frame">frame</button>
    <button id="watch">watching</button>
  </div>
  <div id="layers"></div>
</div>

<!-- The census (world/src/census.rs): every defect the drawn world has, to
     look at. n/p step through the list, r and f record a verdict — real, or
     fine — kept in this browser, c clears the selected one's, `verdicts`
     saves them for the census's calibration and `clear` forgets them all. -->
<div id="census">
  <div id="csum"></div>
  <div id="species"></div>
  <div class="row">
    <button id="cprev">prev (p)</button><button id="cnext">next (n)</button><button id="cexport">verdicts</button><button id="cclear">clear</button>
  </div>
  <div id="defects"></div>
  <div id="detail" class="dim"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MapControls } from 'three/addons/controls/MapControls.js';

// `?src=` lets one server preview several files; the script symlinks the
// chosen .glb to model.glb, so that is the default.
const SRC = new URLSearchParams(location.search).get('src') || 'model.glb';
// The census the run wrote beside it (`--census`); the page does without.
const CENSUS = new URLSearchParams(location.search).get('census') || 'census.json';
const POLL_MS = 1500;

const statusEl = document.getElementById('status');
const layersEl = document.getElementById('layers');
const camEl = document.getElementById('cam');
const say = (t, err = false) => { statusEl.textContent = t; statusEl.classList.toggle('err', err); };

// A logarithmic depth buffer, so the near plane can follow the camera down
// to a kerb's height without the far terrain z-fighting (see `track`).
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2b2e);

// The world is metres and the model spans kilometres, so the far plane is
// generous. The near plane follows the distance to what is looked at
// (`track`): a metre is too far to stand beside a 12 cm kerb, and a
// centimetre is too near for a view of the whole valley.
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 200000);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.02;   // never below the horizon
controls.zoomToCursor = true;                    // toward what the cursor is over
controls.minDistance = 0.5;                      // an eye's height, not inside the ground

scene.add(new THREE.HemisphereLight(0xffffff, 0x5a5348, 2.2));
const sun = new THREE.DirectionalLight(0xfff6e8, 2.0);
sun.position.set(-0.4, 1, 0.6);
scene.add(sun);

let root = null;

// **The orbit point stays on the surface.** The controls zoom toward their
// target by a fraction of the distance per step, so they can only get as
// close as the target is: left at the model's centre it floats hundreds of
// metres over the valley, and panning keeps it at that height. So a height
// grid of the model is built once per load, and every wheel step first
// drops the target onto the surface along the view axis.
let surface = null;

function buildSurface(model) {
  const box = new THREE.Box3().setFromObject(model);
  if (box.isEmpty()) return null;
  // About two million cells at most: 4 m on the loop box.
  const span = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
  const cell = Math.max(1, span / 1400);
  const nx = Math.ceil((box.max.x - box.min.x) / cell) + 1;
  const nz = Math.ceil((box.max.z - box.min.z) / cell) + 1;
  const h = new Float32Array(nx * nz).fill(-Infinity);
  const v = new THREE.Vector3();
  model.updateMatrixWorld(true);
  model.traverse(o => {
    if (!o.isMesh) return;
    const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      const k = Math.floor((v.z - box.min.z) / cell) * nx + Math.floor((v.x - box.min.x) / cell);
      if (v.y > h[k]) h[k] = v.y;
    }
  });
  return { x0: box.min.x, z0: box.min.z, cell, nx, nz, h, top: box.max.y };
}

/// The height of the surface at `(x, z)`, or `null` off the model.
function heightAt(x, z) {
  const s = surface;
  const c = Math.floor((x - s.x0) / s.cell), r = Math.floor((z - s.z0) / s.cell);
  if (c < 0 || r < 0 || c >= s.nx || r >= s.nz) return null;
  const y = s.h[r * s.nx + c];
  return y === -Infinity ? null : y;
}

/// Where the ray through `ndc` (the screen's centre by default) first meets
/// the surface.
const ray = new THREE.Raycaster();
function pick(ndc = new THREE.Vector2(0, 0)) {
  if (!surface) return null;
  ray.setFromCamera(ndc, camera);
  const { origin, direction } = ray.ray;
  const above = t => {
    const x = origin.x + direction.x * t, z = origin.z + direction.z * t;
    const g = heightAt(x, z);
    return g === null ? null : origin.y + direction.y * t - g;
  };
  // March out in steps that grow with the distance, then bisect the step
  // that went under.
  let t = 0, prev = 0;
  for (let i = 0; i < 20000; i++) {
    const step = Math.max(surface.cell / 2, t * 0.004);
    prev = t;
    t += step;
    const a = above(t);
    if (a !== null && a <= 0) {
      let lo = prev, hi = t;
      for (let k = 0; k < 30; k++) {
        const mid = (lo + hi) / 2, m = above(mid);
        if (m !== null && m <= 0) hi = mid; else lo = mid;
      }
      return origin.clone().addScaledVector(direction, hi);
    }
    // Past the model's top and climbing: nothing below will be met.
    if (direction.y >= 0 && origin.y + direction.y * t > surface.top) return null;
  }
  return null;
}

// Before the controls see the wheel: the target moves to the surface along
// the view axis — under the screen's centre, so nothing on screen moves —
// and `zoomToCursor` then zooms toward the cursor at that depth.
renderer.domElement.addEventListener('wheel', () => {
  const hit = pick();
  if (hit) controls.target.copy(hit);
}, { capture: true, passive: true });

/// The near plane at a thousandth of the distance to the orbit point,
/// between a centimetre and a metre, and the camera's readout.
let shownAt = 0;
function track() {
  const d = camera.position.distanceTo(controls.target);
  const near = THREE.MathUtils.clamp(d / 1000, 0.01, 1);
  if (Math.abs(near - camera.near) > near * 0.1) {
    camera.near = near;
    camera.updateProjectionMatrix();
  }
  const now = performance.now();
  if (now - shownAt > 200) {
    shownAt = now;
    const g = surface && heightAt(camera.position.x, camera.position.z);
    const agl = g === null || g === undefined ? '' : `, ${(camera.position.y - g).toFixed(1)} m above the surface`;
    camEl.textContent = `${d < 10 ? d.toFixed(2) : d.toFixed(0)} m to the orbit point${agl}`;
  }
}

/// Free the GPU memory of the model being replaced. Without this a reload
/// every few seconds walks the process up through gigabytes: the geometry
/// of the loop box alone is a quarter of a gigabyte on disk.
function dispose(obj) {
  obj.traverse(o => {
    o.geometry?.dispose();
    for (const m of [o.material].flat()) m?.dispose?.();
  });
}

function frame() {
  if (!root) return;
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  const reach = Math.max(size.x, size.z) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  controls.target.copy(mid);
  // On the surface, not at the box's centre in the air.
  const ground = surface && heightAt(mid.x, mid.z);
  if (ground !== null && ground !== undefined) controls.target.y = ground;
  camera.position.set(mid.x, mid.y + reach * 0.75, mid.z + reach * 0.9);
  camera.updateProjectionMatrix();
  controls.update();
}

function layers(model) {
  const seen = new Map();
  for (const child of model.children) if (child.name) seen.set(child.name, child);
  layersEl.innerHTML = '';
  for (const [name, node] of [...seen].sort()) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = shown.get(name) ?? true;
    node.visible = box.checked;
    box.onchange = () => { node.visible = box.checked; shown.set(name, box.checked); };
    const n = countTriangles(node);
    label.append(box, `${name} `);
    const dim = document.createElement('span');
    dim.className = 'dim';
    dim.textContent = n ? `${n.toLocaleString()}` : '';
    label.append(dim);
    layersEl.append(label);
  }
}
const shown = new Map();   // survives reloads, so a hidden layer stays hidden

function countTriangles(node) {
  let n = 0;
  node.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    n += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  return Math.round(n);
}

const loader = new GLTFLoader();

function load(tag) {
  return new Promise((resolve, reject) => {
    loader.load(
      `${SRC}?v=${encodeURIComponent(tag)}`,
      gltf => {
        // `gltf::triangles` writes POSITION alone and leans on the
        // material's baseColorFactor, so most layers arrive with no
        // normals at all and would shade flat black. The ground is the
        // exception — it carries NORMAL and COLOR_0.
        let computed = 0;
        gltf.scene.traverse(o => {
          // glTF: "when normals are not specified, client implementations
          // MUST calculate flat normals", and `gltf::triangles` leans on
          // that — a mesh of planar pieces wants its faces flat. Three.js
          // computeVertexNormals() on an *indexed* geometry averages across
          // every face sharing a vertex instead, so a wall swept along an
          // outline came out smeared and read as a defect it is not. The
          // de-index is what makes the page show what the file says.
          if (o.isMesh && !o.geometry.attributes.normal) {
            if (o.geometry.index) o.geometry = o.geometry.toNonIndexed();
            o.geometry.computeVertexNormals();
            computed++;
          }
          if (o.isMesh) for (const m of [o.material].flat()) if (m) m.side = THREE.DoubleSide;
        });
        resolve({ model: gltf.scene, computed });
      },
      p => { if (p.total) say(`loading ${(100 * p.loaded / p.total).toFixed(0)} %`); },
      reject,
    );
  });
}

// ---------------------------------------------------------------- census

const SPECIES = {
  gap:     { color: 0xff4d4d, on: true },
  fin:     { color: 0xffa600, on: true },
  flip:    { color: 0xe052ff, on: true },
  buried:  { color: 0xffd23f, on: true },
  fight:   { color: 0x3fd8ff, on: true },
  overlap: { color: 0x5a7dff, on: true },
  crack:   { color: 0x9a9a9a, on: false },
};
const censusEl = document.getElementById('census');
const defectsEl = document.getElementById('defects');
const detailEl = document.getElementById('detail');
let census = null, overlay = null, marker = null, list = [], at = -1;
// Verdicts by a defect's identity: its species and where it is, to the
// centimetre, so a verdict survives a rebuild that did not move it.
const idOf = d => `${d.species}@${d.at.map(v => v.toFixed(2)).join(',')}`;
const verdicts = JSON.parse(localStorage.getItem('census-verdicts') || '{}');
const saveVerdicts = () => localStorage.setItem('census-verdicts', JSON.stringify(verdicts));

// glTF is Y-up: local (east, north, up) is drawn at (east, up, -north).
const v3 = p => new THREE.Vector3(p[0], p[2], -p[1]);

function drawCensus() {
  if (overlay) { scene.remove(overlay); dispose(overlay); }
  overlay = new THREE.Group();
  if (!census) return;
  for (const [name, sp] of Object.entries(SPECIES)) {
    if (!sp.on) continue;
    const ds = census.defects.filter(d => d.species === name);
    const seg = [], tri = [], pts = [];
    for (const d of ds) {
      for (const [a, b] of d.lines) seg.push(...v3(a).toArray(), ...v3(b).toArray());
      for (const t of d.triangles) for (const c of t) tri.push(...v3(c).toArray());
      pts.push(...v3(d.at).toArray());
    }
    // Drawn through everything: a defect behind a wall is still a defect,
    // and the list says where to stand to see it.
    const mat = { color: sp.color, depthTest: false, transparent: true };
    if (seg.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
      overlay.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial(mat)));
    }
    if (tri.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(tri, 3));
      overlay.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ ...mat, opacity: 0.55, side: THREE.DoubleSide })));
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    overlay.add(new THREE.Points(g, new THREE.PointsMaterial({ ...mat, size: 6, sizeAttenuation: false })));
  }
  overlay.renderOrder = 10;
  overlay.traverse(o => { o.renderOrder = 10; });
  scene.add(overlay);
}

function describe(d) {
  const unit = d.species === 'gap' || d.species === 'crack' ? 'm' : 'm²';
  const w = d.species === 'gap' ? `  width ${d.width.toFixed(3)} m` : '';
  return `${d.species}  ${d.size.toFixed(3)} ${unit}  rise ${d.rise.toFixed(2)} m${w}`;
}

function listCensus() {
  if (!census) return;
  censusEl.style.display = 'block';
  const counts = {};
  for (const d of census.defects) counts[d.species] = (counts[d.species] || 0) + 1;
  const judged = Object.keys(verdicts).length;
  document.getElementById('csum').textContent =
    `census: ${census.defects.length} defects, ${census.tally.triangles.toLocaleString()} triangles, ${judged} judged`;
  const speciesEl = document.getElementById('species');
  speciesEl.innerHTML = '';
  for (const [name, sp] of Object.entries(SPECIES)) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = sp.on;
    box.onchange = () => { sp.on = box.checked; drawCensus(); listCensus(); };
    const sw = document.createElement('i');
    sw.style.background = '#' + sp.color.toString(16).padStart(6, '0');
    label.append(box, sw, `${name} ${counts[name] || 0}`);
    speciesEl.append(label);
  }
  list = census.defects.filter(d => SPECIES[d.species]?.on);
  defectsEl.innerHTML = '';
  // The first few hundred: the list is sorted largest first, and a DOM row
  // per crack of the loop box would cost more than it shows.
  list.slice(0, 400).forEach((d, i) => {
    const row = document.createElement('div');
    row.textContent = `${describe(d)}  ${d.layers.join('+')}`;
    const v = verdicts[idOf(d)];
    if (v) row.className = v === 'real' ? 'real' : 'fine';
    row.onclick = () => select(i);
    defectsEl.append(row);
  });
  if (at >= list.length) at = -1;
  if (at >= 0) highlight();
}

function highlight() {
  [...defectsEl.children].forEach((row, i) => row.classList.toggle('on', i === at));
  defectsEl.children[at]?.scrollIntoView({ block: 'nearest' });
  const d = list[at];
  if (!d) return;
  const v = verdicts[idOf(d)];
  detailEl.textContent = `${describe(d)}\n${d.layers.join(' + ')}  (${d.parts} parts)`
    + `\nfaces ${d.faces.slice(0, 8).join(' ') || '-'}`
    + `\nlocal ${d.at.map(v => v.toFixed(2)).join(', ')}`
    + `\n${d.lat.toFixed(6)}, ${d.lon.toFixed(6)}`
    + `\nverdict: ${v || 'none'}  (r real, f fine, c clear)`;
  if (marker) { scene.remove(marker); dispose(marker); }
  const g = new THREE.BufferGeometry().setFromPoints([v3(d.at)]);
  marker = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 16, sizeAttenuation: false, depthTest: false }));
  marker.renderOrder = 11;
  scene.add(marker);
}

/// Stand where the defect fills a good part of the view, looking at it
/// from the side the camera already faces.
function select(i) {
  if (!list.length) return;
  at = (i + list.length) % list.length;
  const d = list[at];
  const reach = d.species === 'gap' || d.species === 'crack' ? Math.min(d.size, 60) : Math.sqrt(d.size) * 3;
  const dist = THREE.MathUtils.clamp(reach * 1.5, 4, 400);
  const aim = v3(d.at);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < 0.35) { dir.y = 0.35; dir.normalize(); }
  controls.target.copy(aim);
  camera.position.copy(aim).addScaledVector(dir, dist);
  controls.update();
  highlight();
}

function judge(v) {
  const d = list[at];
  if (!d) return;
  if (v) verdicts[idOf(d)] = v; else delete verdicts[idOf(d)];
  saveVerdicts();
  listCensus();
  highlight();
}

// Forgetting every verdict takes two clicks: the first arms the button for
// a few seconds, the second clears. No browser dialog.
const clearBtn = document.getElementById('cclear');
let clearArmed = null;
clearBtn.onclick = () => {
  if (!clearArmed) {
    clearBtn.textContent = 'sure?';
    clearArmed = setTimeout(() => { clearArmed = null; clearBtn.textContent = 'clear'; }, 3000);
    return;
  }
  clearTimeout(clearArmed);
  clearArmed = null;
  clearBtn.textContent = 'clear';
  for (const id of Object.keys(verdicts)) delete verdicts[id];
  saveVerdicts();
  listCensus();
  highlight();
};

document.getElementById('cnext').onclick = () => select(at + 1);
document.getElementById('cprev').onclick = () => select(at - 1);
document.getElementById('cexport').onclick = () => {
  // Every verdict with the defect it was given to, as the census wrote it.
  const byId = new Map(census ? census.defects.map(d => [idOf(d), d]) : []);
  const out = Object.entries(verdicts).map(([id, v]) => {
    const d = byId.get(id);
    return { id, verdict: v, ...(d ? { species: d.species, at: d.at, size: d.size, rise: d.rise, width: d.width, layers: d.layers, faces: d.faces } : {}) };
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'census-verdicts.json';
  a.click();
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'n') select(at + 1);
  else if (e.key === 'p') select(at - 1);
  else if (e.key === 'r') judge('real');
  else if (e.key === 'f') judge('fine');
  else if (e.key === 'c') judge(null);
});

async function loadCensus(tag) {
  try {
    const r = await fetch(`${CENSUS}?v=${encodeURIComponent(tag)}`, { cache: 'no-store' });
    census = r.ok ? await r.json() : null;
  } catch { census = null; }
  drawCensus();
  listCensus();
}

async function swap(tag, why) {
  const t0 = performance.now();
  say(`${why}…`);
  const { model, computed } = await load(tag);
  const keep = root ? { pos: camera.position.clone(), aim: controls.target.clone() } : null;
  if (root) { scene.remove(root); dispose(root); }
  root = model;
  scene.add(root);
  surface = buildSurface(root);
  layers(root);
  if (keep) { camera.position.copy(keep.pos); controls.target.copy(keep.aim); controls.update(); }
  else frame();
  // The run writes the census before the .glb, so it is current by now.
  await loadCensus(tag);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  say(`${SRC}\n${countTriangles(root).toLocaleString()} triangles, ${secs}s`
      + `\nnormals computed for ${computed} meshes`
      + `\nreloaded ${new Date().toLocaleTimeString()}`);
}

/// The file's identity as the server reports it. Content-Length is in it
/// as well as the timestamp because a rebuild that takes under a second
/// can land on the same mtime.
async function signature() {
  const r = await fetch(SRC, { method: 'HEAD', cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return `${r.headers.get('last-modified')}|${r.headers.get('content-length')}`;
}

let current = null;
let watching = true;
let pending = null;      // a change seen once but not yet stable

async function poll() {
  if (!watching) return;
  try {
    const sig = await signature();
    if (sig === current) { pending = null; return; }
    // **Wait for it to stop moving.** The world writes the .glb with one
    // truncate-then-write, so a poll landing mid-write sees a short file
    // and would load a truncated model. Two identical readings in a row
    // mean the writer has finished.
    if (sig !== pending) { pending = sig; return; }
    current = sig;
    pending = null;
    await swap(sig, 'file changed, reloading');
  } catch (e) {
    say(`${e.message}\nis scripts/preview-world.sh still running?`, true);
  }
}

document.getElementById('frame').onclick = frame;
const watchBtn = document.getElementById('watch');
watchBtn.onclick = () => {
  watching = !watching;
  watchBtn.textContent = watching ? 'watching' : 'paused';
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); track(); renderer.render(scene, camera); });

(async () => {
  try {
    current = await signature();
    await swap(current, 'loading');
  } catch (e) {
    say(`${e.message}\ncould not read ${SRC}`, true);
  }
  setInterval(poll, POLL_MS);
})();
</script>
