[package]
name = "arpentry-world"
version = "0.1.0"
edition = "2021"
description = "A tile-free 3D world for one bounding box, built one verifiable step at a time"
license = "MIT"

[lib]
name = "arpentry_world"
path = "src/lib.rs"

[[bin]]
name = "arpentry_world"
path = "src/main.rs"

[dependencies]
# The source readers only: the DEM (Mapterhorn PMTiles, or a synthetic
# `flat|ramp|hill|step` field), GeoParquet, and the bbox type. None of the
# model stages — this crate rebuilds the world from the ground up.
arpentry-server = { path = "../server" }
geo-types = "0.7"
# The polygon kernel: buffers and booleans on a pinned integer lattice. Named
# in src/poly.rs and nowhere else.
i_overlay = "7.0.3"
# The ear clipper the mesh step starts from (src/mesh.rs and nowhere else);
# the cuts that make its ears conform to the terrain lattice are the step's own.
earcutr = "0.4"
# The glTF JSON chunk. The writer is hand-rolled (src/gltf.rs); this only
# serialises the document it builds.
serde_json = "1"
# A layer written to disk and read back (src/dump.rs): `--dump` after a step,
# `--from` to start at one, so a step can be run again without the steps
# before it. `serde` is already in the tree through `serde_json`; `postcard`
# is the byte format, compact and fast over millions of floats.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
