[package]
name = "arpentry-server"
version = "0.1.0"
edition = "2021"
description = "Tile server and .arpa archive generator for GeoParquet (Overture / Natural Earth) sources"
license = "MIT"

[[bin]]
name = "arpentry_tiler"
path = "src/main.rs"

[[bin]]
name = "arpentry_server"
path = "src/bin/server.rs"

# Measures an emitted archive against the GENERATION.md invariants. Separate
# from the tiler so it can be pointed at any archive, including one built by an
# older revision, which is what makes a baseline diff meaningful.
[[bin]]
name = "arpentry_verify"
path = "src/bin/verify.rs"

[lib]
name = "arpentry_server"
path = "src/lib.rs"

[dependencies]
# Milestone 1: .arpi tileset (FlatBuffer) + archive metadata compression.
# FlatBuffers bindings are generated with `flatc` (checked in under src/fb/) and
# read/written with this runtime, byte-compatible with the C (flatcc) and web
# clients. Version tracks the flatc used to generate (see src/fb/README).
flatbuffers = "24.3.25"
brotli = "7"
# Milestone 3: geometry types for simplify/clip. Algorithms are hand-rolled
# (Douglas–Peucker, Liang–Barsky, Sutherland–Hodgman), so only the types crate.
geo-types = "0.7"
# Building roofs: polygon-with-holes triangulation (courtyards like the Rolex
# Learning Center). A correct hole-bridging tessellator is hard to hand-roll, so
# we use this faithful Rust port of mapbox/earcut. The no-hole path still uses
# the in-house `earclip` (see building_mesh.rs).
earcutr = "0.4"
# Milestone 4: GeoParquet input. Geometry is a WKB binary column decoded by the
# hand-rolled `wkb` module, so no geoarrow dependency is needed.
arrow = "53"
parquet = "53"
# Server: a small, blocking, thread-per-request HTTP/1.1 stack matching the C
# server's Connection: close model (no async runtime), plus a JSON parser for
# the `.arps` style source file.
tiny_http = "0.12"
serde_json = "1"
# Terrain elevation: Mapterhorn ships Terrarium-encoded DEM tiles (WebP) bundled
# in PMTiles v3 archives. The PMTiles reader is hand-rolled (src/pmtiles.rs);
# `flate2` inflates its gzip-compressed directories and `image` decodes the WebP
# terrarium tiles. Only the two formats we need are enabled to keep the build lean.
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
spade = "2.15.1"
# Road surface as an area (docs/ROADS.md §6.1): buffering a centerline to its
# carriageway width, unioning the results into one region, and offsetting a
# boundary (curb-return closing, antialiasing rim). One crate covers all three —
# `stroke`, `overlay` and `outline` — over a deterministic fixed-point kernel
# whose grid we pin explicitly. `geo`'s BooleanOps would bring its whole
# algorithm tower for the union alone and still leave the offsetting to us.
# Wrapped by `synth::poly`, the only file that names it.
i_overlay = "7.0.3"
#   Milestone 5 pipeline: crossbeam-channel, rayon, clap, anyhow, thiserror, tracing, indicatif

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
